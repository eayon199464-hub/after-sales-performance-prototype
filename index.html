if(page==='home'){content=`<section class="mobile-card"><div class="row"><h3 style="margin:0">${employee.name}</h3>${tag('服务顾问','gray')}</div><p class="muted tiny">武汉光谷店 · ${employee.id}</p></section><section class="mobile-card"><h3>我的待办</h3><button class="list-link" data-act="dms:scheme"><span>11月绩效方案<small>${s.stage<2?'方案尚未下发至员工':employee.confirmed?'已确认，查看方案':'请确认本月指标、权重和目标'}</small></span>${tag(employee.confirmed?'已确认':s.stage>=2?'待确认':'准备中',employee.confirmed?'green':'blue')}</button><button class="list-link" data-act="dms:result"><span>10月绩效结果<small>${employee.id!=='DEMO008'?'当前示例未提供历史结果':res.updated?'申诉结果已更新，无需再次确认':st.appeal?appealStatus():res.confirmed?'已完成结果确认':res.published?'查看结果并确认或申诉':'结果尚未发布'}</small></span>${tag(employee.id!=='DEMO008'?'暂无数据':res.updated?'已更新':st.appeal?'处理中':res.confirmed?'已确认':res.published?'待确认':'未发布',res.updated||res.confirmed?'green':'blue')}</button></section><section class="mobile-card"><h3>11月执行进度</h3><p class="sub">查看各项指标累计完成与目标。</p>${btn('查看我的进度','dms:progress','wide')}</section>`}
if(page==='scheme'){t='月度绩效方案';back=true;content=`<div class="notice">2026年11月 · V${s.version} · ${schemeStages[s.stage]}</div>${s.stage<2?`<section class="mobile-card"><p>当前方案尚未下发至员工。</p><p class="muted tiny">请等待门店服务总监拆解个人目标。</p></section>`:`<section class="mobile-card"><h3>我的考核方案</h3><p class="sub tiny">${employee.name} · ${employee.id} · 服务顾问</p>${metrics.map((m,i)=>i===2&&!s.includeOptional?'':`<div class="row" style="padding:12px 0;border-bottom:1px solid #f2f3f5"><div>${m.name}<small class="muted" style="display:block">${m.type} · 权重 ${s.weights[i]}%</small></div><strong>${employee.targets[i]} ${m.unit}</strong></div>`).join('')}<p class="muted tiny">主观评价：服务规范；加扣分：按事项登记。具体计分规则待确认。</p></section>`}`;if(s.stage===2&&!employee.confirmed)bottom=btn('确认本月方案','employee-confirm','primary');if(employee.confirmed)content+=`<div class="notice">你已确认此版本的指标、权重和目标。方案审批状态：${schemeStages[s.stage]}。</div>`}
if(page==='progress'){t='我的执行进度';content=`<section class="mobile-card"><div class="row"><h3 style="margin:0">2026年11月</h3>${tag('月度累计','gray')}</div><p class="muted tiny">数据截至 11-04 08:30 · 示例数据</p></section>${s.stage<6?'<section class="mobile-card"><p>当前方案尚未生效，审批完成后展示执行进度。</p><p class="muted tiny">个人目标可在月度方案中查看。</p></section>':metrics.map((m,i)=>i===2&&!s.includeOptional?'':metricCard(m,i)).join('')}`}
if(page==='result'){t='月度绩效结果';content=`<div class="notice">2026年10月 · 结果 V${res.version}</div>${!res.published?'<section class="mobile-card"><p>本月结果尚未发布，请稍后查看。</p></section>':`${res.updated?'<div class="notice">申诉处理后的结果已更新，无需再次确认。</div>':st.appeal?`<div class="notice warn">${appealStatus()}。${link('查看处理进度','dms:appeal')}</div>`:res.confirmed?'<div class="notice">你已确认本月绩效结果。</div>':''}${metrics.map((m,i)=>metricCard(m,i,true)).join('')}<section class="mobile-card"><div class="row"><span>主观评价</span><strong>${s.score} 分</strong></div><p class="muted tiny">服务规范评价 · 不允许申诉</p><hr><div class="row"><span>加扣分</span><strong>${s.bonus>=0?'+':''}${s.bonus} 分</strong></div><p class="muted tiny">服务表扬事项 · 不允许申诉</p></section><p class="muted tiny">总分计算规则待确认。</p>`}`;if(res.published&&!res.confirmed&&!st.appeal&&!res.updated)bottom=btn('无异议，确认结果','confirm-result','primary')}
if(page.startsWith('appeal-form')){let i=Number(page.split('-').at(-1));t='指标申诉';back=true;content=`<div class="notice">仅支持必选、可选指标申诉。</div><section class="mobile-card"><h3>${metrics[i].name}</h3><p class="muted tiny">2026年10月 · 原完成值 ${metrics[i].actual} ${metrics[i].unit}</p><div class="field"><label for="appeal-value">期望核实的完成值（选填）</label><input id="appeal-value" type="number" min="0" step="0.01" placeholder="请输入数值"></div><div class="field"><label for="appeal-reason">申诉说明 *</label><textarea id="appeal-reason" maxlength="500" placeholder="请说明差异及相关业务单据编号"></textarea></div><div class="field"><label for="appeal-file">证明材料（可选）</label><input id="appeal-file" type="file" accept=".pdf,.png,.jpg,.jpeg"><p class="muted tiny">演示仅记录文件名，不上传。</p></div><div class="error" id="phone-error" role="alert"></div></section>`;bottom=btn('提交申诉','submit-appeal:'+i,'primary')}
if(page==='appeal'){t='申诉处理进度';back=true;let a=st.appeal;content=a?`<section class="mobile-card"><div class="row"><h3 style="margin:0">${metrics[a.metric].name}</h3>${tag(appealStatus(),a.stage===3?'green':'orange')}</div><p class="muted tiny">${a.id}</p><p>申诉说明：${esc(a.reason)}</p><p>期望核实值：${a.requested==null?'未填写':a.requested+' '+metrics[a.metric].unit}</p>${a.stage===3?`<hr><p>处理结论：${esc(a.conclusion)}</p><p>更新完成值：${a.approvedValue} ${metrics[a.metric].unit}</p><p class="muted tiny">处理结果已同步，无需再次确认。</p>`:''}</section><section class="mobile-card"><h3>处理记录</h3><div class="timeline">${a.history.map(h=>`<div><b>${esc(h)}</b></div>`).join('')}</div></section>`:'<div class="empty">暂无申诉记录</div>'}
if(employee.id!=='DEMO008'&&(page==='result'||page.startsWith('appeal'))){t='月度绩效结果';content='<section class="mobile-card"><p>当前示例员工暂无10月结果。</p></section>';bottom='';}
return `<div class="mobile-stage"><div class="phone"><div class="phone-status"><b>9:41</b><span>●●●　▰</span></div><div class="phone-nav">${back?`<button data-act="dms:${page.startsWith('appeal')?'result':'home'}">‹ 返回</button>`:'<span style="width:44px"></span>'}<h2>${t}</h2><button data-act="fields">说明</button></div><main class="phone-content"><div class="demo-identity"><label for="dms-employee">演示身份</label><select id="dms-employee">${s.assignments.map(p=>`<option value="${p.id}" ${p.id===employee.id?'selected':''}>${p.name} · ${p.id}</option>`).join('')}</select><small>仅用于原型演示；正式小程序按登录人展示。</small></div>${content}</main>${bottom?`<div class="fixed-action">${bottom}</div>`:''}<nav class="phone-tabs">${[['home','待办'],['progress','进度'],['result','结果']].map(([p,l])=>`<button class="${page===p||p==='home'&&page==='scheme'?'on':''}" data-act="dms:${p}">${l}</button>`).join('')}</nav></div><aside class="mobile-note"><div class="code-label">DMS 小程序改造</div><h1>我的绩效</h1><p>员工从新增入口进入，查看方案、月度进度与结果，并对客观指标发起申诉。</p><div class="panel"><h3 class="section-heading">当前演示身份</h3><p class="sub">${employee.name} · 武汉光谷店 · 服务顾问</p><p class="tiny muted">入口位置待与现有 DMS 核对。</p>${btn('打开月度方案','dms:scheme','wide')}</div><div class="panel"><h3 class="section-heading">跨端处理记录</h3><div class="timeline">${st.events.slice(0,4).map(e=>`<div><b>${esc(e.text)}</b><small>${e.time}</small></div>`).join('')||'<p class="muted tiny">暂无操作记录。</p>'}</div></div></aside></div>`}

function render(){let r=route();$('#app').innerHTML=`<div class="reviewbar"><b>售后绩效管理　<span style="font-weight:400;color:#a8b6cd">V1.1 评审原型 · 示例数据</span></b><div class="system-tabs">${[['dmoc','区域作战中心'],['dms','DMS 小程序'],['feishu','飞书预警']].map(([id,l])=>`<button class="${r.system===id?'on':''}" data-act="system:${id}">${l}</button>`).join('')}</div><div class="review-actions"><button data-act="review">评审说明</button><button data-act="reset">重置<span class="reset-label">演示</span></button></div></div>${r.system==='dmoc'?shell():r.system==='dms'?phone():feishu()}`;$('#app').dataset.route=location.hash||'#dmoc/schemes';if(modal)drawModal()}
function openModal(title,body,footer=''){modal={title,body,footer};drawModal()}function drawModal(){$('#modal')?.remove();let el=document.createElement('div');el.id='modal';el.className='drawer-mask';el.innerHTML=`<section class="drawer ${modal.body.includes('diagnosis-table')?'drawer-wide':''}" role="dialog" aria-modal="true" aria-label="${esc(modal.title)}"><header class="drawer-head"><h2>${modal.title}</h2><button class="close" data-act="close" aria-label="关闭">×</button></header><div class="drawer-body">${modal.body}</div><footer class="drawer-foot">${modal.footer||btn('关闭','close')}</footer></section>`;document.body.appendChild(el);el.querySelector('.close').focus()}
function closeModal(){modal=null;$('#modal')?.remove()}
function schemeDetail(edit=false,store=false){let s=st.scheme;if(edit&&(!permission('总部管理员')||s.stage!==0)||store&&(!permission('门店服务总监')||s.stage!==1))return;openModal(store?'拆解员工目标':edit?'配置指标与权重':'月度方案详情',`${steps()}${edit?`<div class="form-grid"><div class="field"><label>方案名称 *</label><input id="scheme-name" value="${esc(s.name)}" maxlength="50"></div><div class="field"><label>考核月份</label><input type="month" value="2026-11" disabled></div><div class="field"><label>适用门店</label><input value="武汉光谷店" disabled></div><div class="field"><label>适用岗位</label><input value="服务顾问" disabled></div></div>`:kv([['方案名称',s.name],['考核月份',s.month],['版本','V'+s.version],['门店',s.store],['员工确认',confirmationText()],['状态',schemeStages[s.stage]]])}<h3>总部下发指标与权重</h3>${table(['指标','类型','权重'],(edit?metrics.map((m,i)=>({...m,index:i})):selectedMetrics()).map(m=>[m.name,m.index===2&&edit?`<label><input id="include-optional" type="checkbox" ${s.includeOptional?'checked':''}> 可选</label>`:tag(m.type,'gray'),edit?`<input aria-label="${m.name}权重" id="weight-${m.index}" type="number" min="0" max="100" value="${s.weights[m.index]}" ${m.index===2&&!s.includeOptional?'disabled':''} style="width:70px"> %`:`${s.weights[m.index]}%`]))}<p class="muted tiny">${edit?'总部配置指标与权重；目标由门店服务总监拆到员工。权重合计 100% 为当前演示规则，正式计分口径待确认。':'指标与权重由总部确定，门店只读。'}</p>${!edit?`<h3>员工目标拆解</h3><p class="sub">${store?'由门店服务总监填写每位员工的个人目标。保存草稿不通知员工，提交后才生成 DMS 确认待办。':'由门店服务总监分配，员工在 DMS 分别确认。'}</p>${allocationTable(store)}<p class="muted tiny">门店总目标来源及分配合计核对口径待确认；当前不校验分配总和。目标数值范围及小数位按正式指标定义确认。</p>`:''}<h3>门店诊断结果</h3><p class="sub tiny">诊断月份：2026-10（示例） · 武汉光谷店 · 示例数据</p>${diagnosisTable()}<p class="muted tiny">修改方案不改变诊断数据；诊断月份的选取规则待确认。</p><h3>主观评价与加扣分</h3><p class="sub">服务规范评价、服务表扬 / 投诉加扣分均不允许申诉。</p><div class="error" id="form-error" role="alert"></div>`,edit?`${btn('取消','close')}${btn('保存草稿','save-scheme','primary')}`:store?`${btn('取消','close')}${btn('保存草稿','save-allocation')}${btn('提交员工确认','save-store','primary')}`:btn('关闭','close'))}
function resultDetail(){openModal('李明的月度绩效结果',`${kv([['人员','李明 · 服务顾问'],['门店','武汉光谷店'],['考核月份','2026-10'],['结果版本','V'+st.result.version],['状态',st.result.updated?'申诉已更新':st.result.confirmed?'已确认':st.result.published?'已发布':'未发布']])}<h3>指标结果</h3>${table(['指标','目标','完成','申诉'],metrics.map((m,i)=>[m.name,`${st.result.targets[i]} ${m.unit}`,`${st.result.updated&&st.appeal?.metric===i?st.appeal.approvedValue:m.actual} ${m.unit}`,'允许']))}<h3>评价与加扣分</h3>${table(['项目','结果','规则'],[['服务规范评价',st.scheme.score+' 分','不允许申诉'],['服务表扬事项',(st.scheme.bonus>=0?'+':'')+st.scheme.bonus+' 分','不允许申诉']])}<p class="muted tiny">总分计算规则待确认。${st.result.updated?'更新后无需再次确认。':''}</p>`)}
function showAppeal(){let a=st.appeal;if(!a)return;let owner=['门店店长','区域售后总监','总部管理员'][a.stage];let actionable=role===owner;openModal('指标申诉处理',`${kv([['申诉单号',a.id],['人员 / 门店','李明 / 武汉光谷店'],['考核月份','2026-10'],['申诉指标',metrics[a.metric].name],['当前状态',appealStatus()],['当前处理角色',owner||'已完成']])}<h3>员工提交内容</h3><div class="readonly">${esc(a.reason)}<br>原完成值：${metrics[a.metric].actual} ${metrics[a.metric].unit}<br>期望核实值：${a.requested==null?'未填写':a.requested+' '+metrics[a.metric].unit}<br>材料：${esc(a.file||'未提供')}</div><h3>处理记录</h3><div class="timeline">${a.history.map(h=>`<div><b>${esc(h)}</b></div>`).join('')}</div>${actionable&&a.stage===1?`<div class="form-grid"><div class="field"><label>核实后的完成值 *</label><input type="number" id="review-value" min="0" step="0.01" value="${a.requested??metrics[a.metric].actual}"></div><div class="field"><label>复核说明 *</label><input id="review-note" placeholder="填写核实依据" maxlength="200"></div></div>`:''}${a.stage>=2?`<h3>区域复核意见</h3><p>${esc(a.conclusion||'')} · 核实值 ${a.approvedValue} ${metrics[a.metric].unit}</p>`:''}<div class="error" id="form-error" role="alert"></div>`,`${btn('关闭','close')}${actionable?btn(['汇总并提交区域复核','提交总部确认','确认并更新结果'][a.stage],'appeal-next','primary'):''}`)}
function fieldHelp(){let r=route();let key=r.system==='dmoc'?r.page:r.system==='dms'?(r.page.startsWith('appeal')?'appeals':'dms'):'feishu';let group=window.FIELD_GROUPS?.[key]||window.FIELD_GROUPS?.common;openModal('页面字段与交互说明',`<p class="sub">字段定义为评审稿，必填项与默认值待确认。</p>${group?table(['字段','类型 / 展示','必填','来源与规则'],group.map(f=>[f[0],f[1],f[2],`<span style="white-space:normal;display:block;min-width:230px">${f[3]}</span>`])):'<p>详见配套需求文档的字段定义。</p>'}`)}
function action(a){let [cmd,arg]=a.split(':');if(cmd==='nav'){filter={area:'',small:'',city:'',store:'',keyword:'',status:''};pendingFilter={...filter};queryMonth=null;pendingMonth=null;go('dmoc',arg)}else if(cmd==='system'){go(arg,arg==='dmoc'?'schemes':arg==='dms'?'home':'card')}else if(cmd==='dms'){go('dms',arg)}else if(cmd==='close')closeModal();else if(cmd==='rule-tab'){metricTab=arg;render()}else if(cmd==='diagnosis')diagnosisDetail();else if(cmd==='diagnosis-fields')openModal('门店诊断结果字段说明',`<p class="sub">九个字段沿用诊断示例，来源映射待核对。</p>${table(['字段','类型 / 展示','要求','来源与规则'],window.FIELD_GROUPS.diagnosis.map(f=>[f[0],f[1],f[2],`<span style="white-space:normal;display:block;min-width:230px">${f[3]}</span>`]))}`,btn('返回诊断结果','diagnosis'));else if(cmd==='fields')fieldHelp();else if(cmd==='review')openModal('评审说明',`<p>在页面右上角点击“字段说明”，查看当前页面的字段与规则。</p><div class="note-grid"><article><h4>已确认的边界</h4><p>总部负责指标和权重，门店服务总监负责目标拆到人。工资核算不在本期；后续推送工资结算系统。主观评价、加扣分不允许申诉。申诉更新后不再次确认。飞书只发管理预警。排名对象为全国直营门店人员。</p></article><article><h4>本版设计建议</h4><p>菜单、字段、角色范围和状态为拟定方案；权重合计100%、申诉与确认互斥、归档条件待确认。</p></article><article><h4>尚未确定</h4><p>正式指标和评分公式、跨岗位排名、并列和人数取整、审批退回、申诉时限、通知接收人与发送时间。</p></article><article><h4>如何演示</h4><p>总部配置指标权重并下发 → 服务总监拆解员工目标 → 两名示例员工分别在 DMS 确认 → 店长、区域、大区依次审批。结果发布后，可确认或申诉；重置后体验另一分支。当前申诉仅演示一轮完成值核实；申诉字段范围和再次申诉规则待确认。</p></article></div><p class="muted tiny">数据均为示例，操作仅保存在当前浏览器。未接入真实数据和飞书发送；审批退回、多轮申诉、附件上传、全量历史查询及接口异常处理未实现。</p>`);else if(cmd==='reset')openModal('重置演示数据','<p>清除本原型的方案状态、申诉、确认和快照，恢复初始示例。</p>',btn('取消','close')+btn('重置','do-reset','primary'));else if(cmd==='do-reset'){st=base();dmsEmployeeId='DEMO008';save();closeModal();render();toast('演示已重置')}
else if(cmd==='edit-scheme')schemeDetail(true);else if(cmd==='scheme-detail')schemeDetail();else if(cmd==='store-confirm')schemeDetail(false,true);
else if(cmd==='save-scheme'){if(!permission('总部管理员')||st.scheme.stage!==0||!$('#scheme-name'))return;let includeOptional=$('#include-optional').checked,weights=metrics.map((_,i)=>i===2&&!includeOptional?0:Number($('#weight-'+i).value));let missingWeight=metrics.some((_,i)=>(i<2||includeOptional)&&$('#weight-'+i).value==='');let err=!$('#scheme-name').value.trim()?'请填写方案名称':missingWeight?'请填写所有已选指标的权重':!weights.every(n=>Number.isFinite(n)&&n>=0&&n<=100)||Math.abs(weights.reduce((x,y)=>x+y,0)-100)>0.001?'当前演示要求客观指标权重合计为100%':'';if(err){$('#form-error').textContent=err;return}st.scheme.includeOptional=includeOptional;st.scheme.weights=weights;st.scheme.name=$('#scheme-name').value.trim();event('总部保存指标与权重');closeModal();render();toast('草稿已保存')}
else if(cmd==='save-allocation'||cmd==='save-store'){if(!permission('门店服务总监')||st.scheme.stage!==1||!$('#allocation-'+st.scheme.assignments[0].id+'-0'))return;let proposed=st.scheme.assignments.map(p=>({...p,targets:[...p.targets]})),err='';for(let p of proposed){for(let m of selectedMetrics()){let raw=$('#allocation-'+p.id+'-'+m.index).value.trim();if(raw===''&&cmd==='save-store')err=`请填写${p.name}的${m.name}目标`;else if(raw!==''&&!Number.isFinite(Number(raw)))err=`${p.name}的${m.name}目标须为数值`;p.targets[m.index]=raw===''?null:Number(raw);}}if(err){$('#form-error').textContent=err;return}st.scheme.assignments=proposed;if(cmd==='save-store'){st.scheme.assignments.forEach(p=>p.confirmed=false);st.scheme.employeeConfirmed=false;st.scheme.stage=2;delete st.scheme.migrationNotice;event('门店服务总监提交两名员工的个人目标，待 DMS 分别确认')}else event('门店服务总监保存员工目标草稿');closeModal();render();toast(cmd==='save-store'?'已生成员工确认待办':'员工目标草稿已保存')}
else if(cmd==='dispatch'){if(st.scheme.stage!==0||!permission('总部管理员'))return;st.scheme.stage=1;event('总部下发指标与权重至门店');render();toast('已下发，请切换门店服务总监拆解员工目标')}
else if(cmd==='employee-confirm'){let p=currentEmployee();if(route().system!=='dms'||st.scheme.stage!==2||p.confirmed)return;p.confirmed=true;let all=confirmedCount()===st.scheme.assignments.length;st.scheme.employeeConfirmed=all;if(all)st.scheme.stage=3;event(p.name+'确认本月方案'+(all?'，全部员工已确认，进入店长审批':''));render();toast(all?'全部员工已确认，进入店长审批':'本人方案已确认并回传')}
else if(cmd==='approve-detail'){let needed={3:'门店店长',4:'区域售后总监',5:'售后大区审批人'}[st.scheme.stage];if(!needed||role!==needed)return;openModal('审核月度方案',`${steps()}${kv([['门店','武汉光谷店'],['月份','2026-11'],['员工确认',confirmationText()]])}<h3>总部指标与权重</h3>${table(['指标','类型','权重'],selectedMetrics().map(m=>[m.name,m.type,st.scheme.weights[m.index]+'%']))}<h3>门店服务总监分配的个人目标</h3>${allocationTable()}<p class="muted tiny">全员确认后发起审批为当前演示规则，部分未确认的处理待业务确认。退回路径待确认，原型仅支持通过。</p>`,btn('关闭','close')+btn('审批通过','approve','primary'))}
else if(cmd==='approve'){let needed={3:'门店店长',4:'区域售后总监',5:'售后大区审批人'}[st.scheme.stage];if(!needed||role!==needed||confirmedCount()!==st.scheme.assignments.length)return;st.scheme.stage++;event(role+'审批通过');closeModal();render();toast(st.scheme.stage===6?'月度方案已生效':'已进入下一审批节点')}
else if(cmd==='reset-filter'){filter={area:'',small:'',city:'',store:'',keyword:'',status:''};pendingFilter={...filter};queryMonth=null;pendingMonth=null;render()}else if(cmd==='query'){pendingFilter.keyword=$('#person-search')?.value.trim()||'';pendingFilter.status=$('#warning-filter')?.value||'';filter={...pendingFilter};pendingMonth=$('#period')?.value||null;queryMonth=pendingMonth;render()}else if(cmd==='only-warning'){filter.status='预警人员';pendingFilter={...filter};render()}
else if(cmd==='person'){let p=scoped().find(x=>x.id===arg);if(!p)return;openModal('个人执行明细',`${kv([['人员',p.name],['工号',p.id],['门店',p.store],['岗位',p.job],['全国名次',p.rank+' / 10'],['状态',p.warning?'后30%预警':'正常']])}<h3>月度指标</h3>${table(['指标','目标','累计完成','单位'],selectedMetrics().map(m=>[m.name,executionTargets(p)[m.index]??'—（方案未生效）',m.index===0?p.actual:p.name==='李明'?metrics[m.index].actual:p.name==='周然'?[88,136,14][m.index]:'—',m.unit]))}<p class="muted tiny">“—”表示无数据。全国名次不随筛选变化。</p>`)}
else if(cmd==='edit-evaluation')openModal('录入评价与加扣分',`<p class="sub">李明 · 2026年10月</p><div class="form-grid"><div class="field"><label>服务规范评价（0–10分）*</label><input id="eval-score" type="number" min="0" max="10" step="0.1" value="${st.scheme.score}"></div><div class="field"><label>加扣分（正数加分，负数扣分）*</label><input id="eval-bonus" type="number" step="0.1" value="${st.scheme.bonus}"></div></div><div class="field" style="margin-top:16px"><label>事项说明 *</label><textarea id="eval-note">服务表扬事项，已核实业务依据。</textarea></div><p class="muted tiny">评价人、分值范围及上限待确认。</p><div class="error" id="form-error" role="alert"></div>`,btn('取消','close')+btn('保存','save-eval','primary'));
else if(cmd==='save-eval'){let score=Number($('#eval-score').value),bonus=Number($('#eval-bonus').value);if($('#eval-score').value===''||score<0||score>10||!Number.isFinite(bonus)||$('#eval-bonus').value===''||!$('#eval-note').value.trim()){$('#form-error').textContent='请填写合法分值及事项说明';return}st.scheme.score=score;st.scheme.bonus=bonus;event('保存评价及加扣分');closeModal();render();toast('已保存')}
else if(cmd==='publish-result'){if(role!=='总部管理员'||st.result.published)return;st.result.published=true;event('10月结果发布至 DMS');render();toast('结果已发布，员工可在 DMS 查看')}
else if(cmd==='result-detail')resultDetail();else if(cmd==='confirm-result'){if(route().system!=='dms'||dmsEmployeeId!=='DEMO008'||!st.result.published||st.appeal||st.result.updated||st.result.confirmed)return;st.result.confirmed=true;event('员工确认10月结果');render();toast('结果确认已回传')}
else if(cmd==='appeal-form'){if(route().system!=='dms'||dmsEmployeeId!=='DEMO008'||st.appeal||st.result.confirmed||st.result.updated||!st.result.published)return;go('dms','appeal-form-'+arg)}else if(cmd==='submit-appeal'){if(route().system!=='dms'||dmsEmployeeId!=='DEMO008'||st.appeal||st.result.updated||st.result.confirmed)return;let val=$('#appeal-value').value,reason=$('#appeal-reason').value.trim();if(!reason||(val!==''&&(Number(val)<0||!Number.isFinite(Number(val))))){$('#phone-error').textContent='请填写申诉说明；完成值须为非负数';return}st.appeal={id:'AP-202610-001',metric:Number(arg),requested:val===''?null:Number(val),reason,file:$('#appeal-file').files[0]?.name||'',stage:0,history:['员工李明提交指标申诉']};event('员工提交指标申诉，待门店汇总');go('dms','appeal');toast('申诉已提交')}
else if(cmd==='appeal-detail')showAppeal();else if(cmd==='appeal-next'){let a=st.appeal;if(!a||role!==['门店店长','区域售后总监','总部管理员'][a.stage])return;if(a.stage===0){a.stage=1;a.history.push('门店店长汇总并提交区域复核')}else if(a.stage===1){let v=$('#review-value').value,n=$('#review-note').value.trim();if(v===''||Number(v)<0||!n){$('#form-error').textContent='请填写核实完成值和复核说明';return}a.approvedValue=Number(v);a.conclusion=n;a.stage=2;a.history.push('区域复核完成：'+n)}else{a.stage=3;a.history.push('总部确认，更新结果 V2');st.result.updated=true;st.result.version=2;st.result.confirmed=false}event(appealStatus());closeModal();render();toast(a.stage===3?'结果已更新，不再要求员工确认':'已提交下一节点')}
else if(cmd==='snapshot'){if(role!=='总部管理员'||(!st.result.updated&&!st.result.confirmed)||st.appeal&&st.appeal.stage<3)return;if(st.snapshots.some(x=>x.version===st.result.version)){toast('当前版本已有快照');return}st.snapshots.push({id:'SN-202610-V'+st.result.version,version:st.result.version,score:st.scheme.score,bonus:st.scheme.bonus,actuals:metrics.map((m,i)=>st.result.updated&&st.appeal.metric===i?st.appeal.approvedValue:m.actual)});event('保存10月结果快照');render();toast('已保存月度快照并模拟回传')}
else if(cmd==='snapshot-detail'){let s=st.snapshots[Number(arg)];openModal('月度快照',`${kv([['编号',s.id],['月份','2026-10'],['版本','V'+s.version]])}<h3>快照结果</h3>${table(['指标','完成值'],metrics.map((m,i)=>[m.name,s.actuals[i]+' '+m.unit]))}<p>主观评价 ${s.score} 分 · 加扣分 ${s.bonus} 分</p><p class="muted tiny">工资结算系统对接属于后续需求，本期不推送。</p>`)}
else if(cmd==='alert-log')openModal('预警发送记录',`${table(['时间','范围','人数','发送状态'],st.notifications.map(n=>[n.time,n.scope,n.people,tag(n.status,'green')]))}<p class="muted tiny">模拟发送记录，未实际发送。</p>`);
else if(cmd==='feishu-link'){role='区域售后总监';filter={area:'湖北大区',small:'',city:'',store:'',keyword:'',status:'预警人员'};pendingFilter={...filter};queryMonth=null;pendingMonth=null;go('dmoc','tracking');toast('已打开授权范围内的预警明细')}
else if(cmd==='metric'){let m=metrics[Number(arg)];openModal('指标配置',`${kv([['指标编码',m.code],['指标名称',m.name],['类型',m.type],['单位',m.unit],['适用岗位','服务顾问'],['数据来源',m.source]])}<h3>计算及取数</h3><div class="readonly">统计口径、取数来源和评分规则由总部与大数据团队确认。</div><h3>权重建议范围</h3><p>拟设单项 0–100%，客观指标权重合计 100%。</p>`)}
else if(cmd==='new-metric')openModal('新增指标',`<div class="form-grid"><div class="field"><label>指标编码 *</label><input id="new-code" placeholder="例如 AS004"></div><div class="field"><label>指标名称 *</label><input id="new-name" placeholder="输入指标名称"></div><div class="field"><label>指标类型 *</label><select id="new-type">${options(['必选','可选'],'必选')}</select></div><div class="field"><label>单位 *</label><input id="new-unit" placeholder="例如 次"></div></div><p class="muted tiny">新增后保存为草稿，不加入已有方案。</p><div class="error" id="form-error" role="alert"></div>`,btn('取消','close')+btn('保存','save-metric','primary'));
else if(cmd==='save-metric'){let code=$('#new-code').value.trim(),name=$('#new-name').value.trim(),unit=$('#new-unit').value.trim();if(!code||!name||!unit||metrics.some(m=>m.code===code)){$('#form-error').textContent='请填写完整信息，指标编码不可重复';return}st.extraMetrics=st.extraMetrics||[];st.extraMetrics.push({code,name,unit,type:$('#new-type').value});save();closeModal();toast('指标草稿已保存');render();let t=document.querySelector('tbody');if(false&&t)t.insertAdjacentHTML('beforeend',`<tr><td>${esc(code)}</td><td>${esc(name)}</td><td>${tag(st.extraMetrics.at(-1).type)}</td><td>${esc(unit)}</td><td>待配置</td><td>待映射</td><td>${tag('草稿','gray')}</td><td>待补齐规则</td></tr>`)}
else if(cmd==='evaluation-rule'||cmd==='bonus-rule')openModal(cmd==='evaluation-rule'?'主观评价规则':'加扣分规则',`<p>${cmd==='evaluation-rule'?'示例评价项：服务规范；示例分值范围0–10分。':'按事项登记加分或扣分，必须说明业务依据。'}</p><p>此类结果不允许申诉。</p><p class="muted tiny">评价人、分值范围、复核与计分规则待确认。</p>`)
}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b&&!b.disabled)action(b.dataset.act)});document.addEventListener('change',e=>{if(e.target.id==='dms-employee'){if(st.scheme.assignments.some(p=>p.id===e.target.value)){dmsEmployeeId=e.target.value;closeModal();render()}return;}if(e.target.id==='include-optional'){let w=$('#weight-2');w.disabled=!e.target.checked;if(!e.target.checked)w.value=0;else w.value=st.scheme.weights[2]||20;}if(e.target.id==='role'){role=e.target.value;filter={area:'',small:'',city:'',store:'',keyword:'',status:''};pendingFilter={...filter};queryMonth=null;pendingMonth=null;closeModal();render()}if(e.target.dataset.filter){let key=e.target.dataset.filter,order=['area','small','city','store'];pendingFilter.keyword=$('#person-search')?.value.trim()||'';pendingMonth=$('#period')?.value||null;pendingFilter[key]=e.target.value;order.slice(order.indexOf(key)+1).forEach(k=>pendingFilter[k]='');render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&modal){let nodes=[...$('#modal').querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled)')];let first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});window.addEventListener('hashchange',render);render();
</script></body></html>

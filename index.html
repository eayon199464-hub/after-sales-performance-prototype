    openModal('指标申诉处理', `${kv([['申诉单号', a.id], ['员工 / 门店', p.name + ' / ' + p.store], ['考核月份', a.month], ['申诉指标', a.metricName], ['当前状态', statusNames[a.stage]], ['当前处理角色', stageRoles[a.stage] || '已完成']])}<h3>员工提交内容</h3><div class="readonly">${esc(a.reason)}<br>原完成值：${a.originalValue} ${a.unit}<br>期望核实值：${a.requested == null ? '未填写' : a.requested + ' ' + a.unit}<br>材料：${esc(a.file || '未提供')}</div><h3>处理记录</h3>${historyHtml(a)}${actionable && a.stage === 1 ? `<div class="form-grid"><div class="field"><label for="review-value">核实后的完成值 *</label><input id="review-value" type="number" step="any" value="${a.requested ?? a.originalValue}"></div><div class="field"><label for="review-note">复核说明 *</label><textarea id="review-note" maxlength="300" placeholder="填写核实依据及处理意见"></textarea></div></div>` : ''}${a.stage >= 2 ? `<h3>区域复核意见</h3><p>${esc(a.conclusion)}<br>核实值：${a.approvedValue} ${a.unit}</p>` : ''}${a.stage === 3 ? '<p class="sub">结果已同步员工，员工无需再次确认。</p>' : ''}<div class="error" id="form-error" role="alert"></div>`, btn('关闭', 'close') + (actionable ? btn(['汇总并提交区域复核', '提交总部确认', '确认并更新结果'][a.stage], 'ap-next:' + a.id, 'primary') : ''));
  };

  archive = function () {
    const rows = visibleResults();
    const eligible = rows.filter(r => (r.confirmed || r.updated) && !activeAppeals(r).length);
    const snapshots = (st.resultSnapshots || []).filter(s => canViewEmployee(s.employeeId) && inQuery(personFor(s.employeeId), s.month));
    return title('月度归档', '保存员工结果版本及相关处理记录', btn('生成可归档结果快照', 'rp-snapshot', 'primary', role !== '总部管理员' || !eligible.length)) + filters('results') + `<section class="panel"><p class="sub">当前演示将已确认或已处理完申诉的员工结果单独归档。整月归档条件仍待确认。</p>${table(['快照编号', '月份', '员工 / 门店', '结果版本', 'DMS 同步', '大数据归档', '操作'], snapshots.map(s => {const p = personFor(s.employeeId);return [s.id, s.month, p.name + ' / ' + p.store, 'V' + s.version, tag('模拟成功', 'green'), tag('模拟成功', 'green'), link('查看快照', 'rp-snapshot-detail:' + s.id)];}))}${pager(snapshots.length)}</section>`;
  };

  function mobileMetric(r, m, index) {
    return `<section class="mobile-card"><div class="row"><span class="metric-title">${m.name}</span>${tag(m.type, 'gray')}</div><div class="row"><div><span class="big">${m.actual}</span><span class="muted tiny"> / ${m.target} ${m.unit}</span></div><span class="sub tiny">权重 ${m.weight}%</span></div><div class="row"><span class="muted tiny">客观指标结果</span>${eligibleForAppeal(r) ? link('对该指标申诉', 'rp-appeal-form:' + index) : ''}</div></section>`;
  }

  window.resultPhonePage = function (page, employee) {
    ensureResults(); const r = resultForEmployee(employee.id), s = typeof employeeScheme === 'function' ? employeeScheme(employee.id) : st.scheme;
    let content = '', bottom = '', t = '我的绩效', back = false;
    if (!['home', 'result', 'appeal'].includes(page) && !page.startsWith('appeal-form-')) return null;
    if (!r) return {t, back, bottom, content: '<div class="empty">暂无本人的月度结果。</div>'};
    if (page === 'home') {
      const state = statusForResult(r);
      content = `<section class="mobile-card"><div class="row"><h3 style="margin:0">${esc(employee.name)}</h3>${tag(employee.job || '服务顾问', 'gray')}</div><p class="muted tiny">${esc(employee.store)} · ${employee.id}</p></section><section class="mobile-card"><h3>我的待办</h3><button class="list-link" data-act="dms:scheme"><span>11月绩效方案<small>${!s || s.stage < 2 ? '等待门店分配指标和目标' : employee.confirmed ? '已确认，可查看本人的方案' : '请确认分配给本人的指标与目标'}</small></span>${tag(employee.confirmed ? '已确认' : s && s.stage >= 2 ? '待确认' : '准备中', employee.confirmed ? 'green' : 'blue')}</button><button class="list-link" data-act="dms:result"><span>10月绩效结果<small>${r.updated ? '处理结果已更新，无需再次确认' : activeAppeals(r).length ? '查看本人申诉的处理进度' : r.confirmed ? '本人已确认，可继续查看' : '查看本月结果，确认或提出指标申诉'}</small></span>${tag(state, r.updated || r.confirmed ? 'green' : 'blue')}</button></section><section class="mobile-card"><h3>11月执行进度</h3><p class="sub">查看本人各指标累计完成与目标。</p>${btn('查看我的进度', 'dms:progress', 'wide')}</section>`;
    } else if (page === 'result') {
      t = '月度绩效结果';
      content = `<div class="notice">${r.month} · 结果 V${r.version} · ${statusForResult(r)}</div>${r.updated ? '<div class="notice">申诉处理后的结果已更新，无需再次确认。</div>' : r.confirmed ? '<div class="notice">你已确认本月绩效结果。</div>' : ''}${r.items.map((m, i) => mobileMetric(r, m, i)).join('')}<section class="mobile-card"><div class="row"><span>主观评价</span><strong>${r.score} 分</strong></div><p class="muted tiny">服务规范评价 · 不允许申诉</p><hr><div class="row"><span>加扣分</span><strong>${r.bonus >= 0 ? '+' : ''}${r.bonus} 分</strong></div><p class="muted tiny">服务事项记录 · 不允许申诉</p></section>${resultAppeals(r).length ? `<section class="mobile-card"><h3>我的申诉</h3>${resultAppeals(r).map(a => `<button class="list-link" data-act="rp-appeal-view:${a.id}"><span>${a.metricName}<small>${a.id}</small></span>${tag(statusNames[a.stage], a.stage === 3 ? 'green' : 'orange')}</button>`).join('')}</section>` : ''}<p class="muted tiny">总分计算规则待确认，当前展示分项结果。</p>`;
      if (eligibleForConfirmation(r)) bottom = btn('无异议，确认结果', 'rp-confirm-result', 'primary');
    } else if (page.startsWith('appeal-form-')) {
      t = '指标申诉'; back = true; const i = Number(page.slice('appeal-form-'.length)), m = r.items[i];
      if (!m || !eligibleForAppeal(r) || !['必选', '可选'].includes(m.type)) content = '<div class="notice">当前结果不可提交此项申诉，请返回查看处理进度。</div>';
      else {content = `<div class="notice">仅支持必选、可选指标申诉。</div><section class="mobile-card"><h3>${m.name}</h3><p class="muted tiny">${r.month} · 原完成值 ${m.actual} ${m.unit}</p><div class="field"><label for="appeal-value">期望核实的完成值（选填）</label><input id="appeal-value" type="number" step="any" placeholder="请输入数值"></div><div class="field"><label for="appeal-reason">申诉说明 *</label><textarea id="appeal-reason" maxlength="500" placeholder="说明差异及相关业务单据"></textarea></div><div class="field"><label for="appeal-file">证明材料（可选）</label><input id="appeal-file" type="file" accept=".pdf,.png,.jpg,.jpeg"><p class="muted tiny">演示仅记录文件名，不上传。</p></div><div class="error" id="phone-error" role="alert"></div></section>`;bottom = btn('提交申诉', 'rp-submit-appeal:' + i, 'primary');}
    } else {
      t = '申诉处理进度'; back = true;
      const a = resultAppeals(r).find(x => x.id === activeAppealId) || resultAppeals(r)[0];
      content = a ? `<section class="mobile-card"><div class="row"><h3 style="margin:0">${a.metricName}</h3>${tag(statusNames[a.stage], a.stage === 3 ? 'green' : 'orange')}</div><p class="muted tiny">${a.id}</p><p>申诉说明：${esc(a.reason)}</p><p>期望核实值：${a.requested == null ? '未填写' : a.requested + ' ' + a.unit}</p>${a.stage === 3 ? `<hr><p>处理结论：${esc(a.conclusion)}</p><p>更新完成值：${a.approvedValue} ${a.unit}</p><p class="muted tiny">结果已更新，无需再次确认。</p>` : ''}</section><section class="mobile-card"><h3>处理记录</h3>${historyHtml(a)}</section>` : '<div class="empty">暂无本人的申诉记录。</div>';
    }
    return {t, content, bottom, back};
  };

  const baseAction = action;
  action = function (a) {
    ensureResults(); const [cmd, arg] = a.split(':');
    if (cmd === 'publish-result') return;
    if (cmd === 'result-detail' || cmd === 'rp-detail') { resultDetail(arg || activeResultId || visibleResults()[0]?.id); return; }
    if (cmd === 'appeal-detail' || cmd === 'ap-detail') { showAppeal(arg || activeAppealId || visibleAppeals()[0]?.id); return; }
    if (cmd === 'ap-filter') { appealStageFilter = arg; render(); return; }
    if (cmd === 'rp-evaluation') {
      const r = resultById(arg); if (route().system !== 'dmoc' || !r || !canViewEmployee(r.employeeId) || !['总部管理员', '门店服务总监'].includes(role) || !eligibleForConfirmation(r)) return;
      activeResultId = r.id; const p = personFor(r.employeeId);
      openModal('录入评价与加扣分', `<p class="sub">${p.name} · ${r.month}</p><div class="form-grid"><div class="field"><label>服务规范评价（示例 0–10 分）*</label><input id="eval-score" type="number" step="any" value="${r.score}"></div><div class="field"><label>加扣分 *</label><input id="eval-bonus" type="number" step="any" value="${r.bonus}"></div></div><div class="field"><label>事项说明 *</label><textarea id="eval-note">${esc(r.evaluationNote)}</textarea></div><p class="muted tiny">示例分值边界与录入责任待确认。</p><div class="error" id="form-error" role="alert"></div>`, btn('取消', 'close') + btn('保存', 'rp-save-eval:' + r.id, 'primary')); return;
    }
    if (cmd === 'rp-save-eval') {
      const r = resultById(arg); if (route().system !== 'dmoc' || !r || !canViewEmployee(r.employeeId) || !['总部管理员', '门店服务总监'].includes(role) || !eligibleForConfirmation(r) || !$('#eval-score')) return;
      const score = Number($('#eval-score').value), bonus = Number($('#eval-bonus').value), note = $('#eval-note').value.trim();
      if (!$('#eval-score').value || !$('#eval-bonus').value || !Number.isFinite(score) || score < 0 || score > 10 || !Number.isFinite(bonus) || !note) { $('#form-error').textContent = '请填写有效分值及事项说明；示例评价范围为0–10分'; return; }
      r.score = score; r.bonus = bonus; r.evaluationNote = note; event(personFor(r.employeeId).name + '的评价及加扣分已保存'); closeModal(); render(); toast('已保存本人结果记录'); return;
    }
    if (cmd === 'rp-confirm-result' || cmd === 'confirm-result') {
      const r = resultForEmployee(); if (route().system !== 'dms' || !eligibleForConfirmation(r)) return;
      r.confirmed = true; r.confirmedAt = nowText(); event(personFor(r.employeeId).name + '确认10月结果'); render(); toast('本人结果确认已回传'); return;
    }
    if (cmd === 'rp-appeal-form' || cmd === 'appeal-form') {
      const r = resultForEmployee(), m = r?.items[Number(arg)]; if (route().system !== 'dms' || !eligibleForAppeal(r) || !m || !['必选', '可选'].includes(m.type)) return;
      go('dms', 'appeal-form-' + Number(arg)); return;
    }
    if (cmd === 'rp-submit-appeal' || cmd === 'submit-appeal') {
      const r = resultForEmployee(), m = r?.items[Number(arg)]; if (route().system !== 'dms' || !eligibleForAppeal(r) || !m || !['必选', '可选'].includes(m.type) || !$('#appeal-reason')) return;
      const reason = $('#appeal-reason').value.trim(), val = $('#appeal-value').value;
      if (!reason || val !== '' && !Number.isFinite(Number(val))) { $('#phone-error').textContent = '请填写申诉说明；核实值需为有效数值'; return; }
      let sequence = st.appealRecords.length + 1, id;
      do { id = 'AP-202610-' + String(sequence++).padStart(3, '0'); } while (st.appealRecords.some(x => x.id === id));
      const record = {id, employeeId: r.employeeId, resultId: r.id, month: r.month, metricCode: m.code, metricName: m.name, unit: m.unit, originalValue: m.actual, target: m.target, originalVersion: r.version, requested: val === '' ? null : Number(val), reason, file: $('#appeal-file').files[0]?.name || '', stage: 0, submittedAt: nowText(), approvedValue: null, conclusion: '', history: [{text: personFor(r.employeeId).name + '提交指标申诉', time: nowText()}]};
      st.appealRecords.push(record); activeAppealId = record.id; event('员工提交指标申诉，待门店汇总'); go('dms', 'appeal'); toast('申诉已提交'); return;
    }
    if (cmd === 'rp-appeal-view') {
      const r = resultForEmployee(), record = st.appealRecords.find(x => x.id === arg && x.resultId === r?.id); if (route().system !== 'dms' || !record) return;
      activeAppealId = record.id; go('dms', 'appeal'); return;
    }
    if (cmd === 'ap-next' || cmd === 'appeal-next') {
      const record = st.appealRecords.find(x => x.id === (arg || activeAppealId)); if (!canActOnAppeal(record)) return;
      if (record.stage === 0) { record.stage = 1; appendHistory(record, '门店店长汇总并提交区域复核'); }
      else if (record.stage === 1) {
        if (!$('#review-value') || !$('#review-note')) return;
        const raw = $('#review-value').value, note = $('#review-note').value.trim();
        if (raw === '' || !Number.isFinite(Number(raw)) || !note) { $('#form-error').textContent = '请填写核实完成值和复核说明'; return; }
        record.approvedValue = Number(raw); record.conclusion = note; record.stage = 2; appendHistory(record, '区域复核完成：' + note);
      } else {
        const r = resultById(record.resultId), item = r?.items.find(m => m.code === record.metricCode);
        if (!item || record.approvedValue == null) return;
        item.actual = record.approvedValue; r.version++; r.updated = true; r.confirmed = false; record.stage = 3;
        appendHistory(record, '总部确认，结果更新为 V' + r.version);
      }
      event(record.id + '：' + statusNames[record.stage]); closeModal(); render(); toast(record.stage === 3 ? '对应员工结果已更新，无需再次确认' : '已提交下一节点'); return;
    }
    if (cmd === 'rp-snapshot' || cmd === 'snapshot') {
      if (route().system !== 'dmoc' || role !== '总部管理员') return;
      let count = 0;
      visibleResults().filter(r => (r.confirmed || r.updated) && !activeAppeals(r).length).forEach(r => {
        if (st.resultSnapshots.some(s => s.employeeId === r.employeeId && s.month === r.month && s.version === r.version)) return;
        st.resultSnapshots.push({...JSON.parse(JSON.stringify(r)), id: `SN-${r.month.replace('-', '')}-${r.employeeId}-V${r.version}`, snapshotAt: nowText()}); count++;
      });
      event('保存' + count + '份员工结果快照'); render(); toast(count ? '已生成 ' + count + ' 份结果快照' : '当前可归档版本已有快照'); return;
    }
    if (cmd === 'rp-snapshot-detail') {
      const s = st.resultSnapshots.find(x => x.id === arg); if (!s || !canViewEmployee(s.employeeId)) return;
      openModal('月度结果快照', `${kv([['编号', s.id], ['员工', personFor(s.employeeId).name], ['月份', s.month], ['版本', 'V' + s.version]])}${resultMetricTable(s)}<p>主观评价 ${s.score} 分 · 加扣分 ${s.bonus} 分</p><p class="muted tiny">本快照保存生成时的数据，不随之后的结果修改。</p>`, btn('关闭', 'close')); return;
    }
    if (['edit-evaluation', 'save-eval', 'snapshot-detail'].includes(cmd)) return;
    const result = baseAction(a);
    if (cmd === 'do-reset') { activeResultId = null; activeAppealId = null; appealStageFilter = 'all'; ensureResults(); save(); render(); }
    return result;
  };
  ensureResults();
  save();
  render();
})();
</script></body></html>
